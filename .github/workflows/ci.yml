name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows hosted x64 validation
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Show SDK information
        run: dotnet --info

      - name: Run complete x64 validation
        shell: pwsh
        run: .\scripts\check.ps1 -Configuration Release -VerifyFormat

      - name: Build and validate ephemeral x64 plus ARM64 PrivateTest MSIX bundle
        shell: pwsh
        run: |
          $certificate = .\scripts\new-private-test-certificate.ps1 `
            -OutputPath .\artifacts\ci-private-test-x64.crt `
            -ValidityDays 90
          try {
            .\scripts\build-msix-bundle.ps1 `
              -Mode PrivateTest `
              -SigningCertificateThumbprint $certificate.Thumbprint `
              -PublicCertificatePath $certificate.PublicCertificatePath `
              -SkipChecks
          }
          finally {
            if ($certificate.Created) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
          }

          .\scripts\build-msix.ps1 `
            -Mode Store `
            -RuntimeIdentifier win-x64 `
            -IdentityName 'p-darksy-r.LocalNetworkScanner.CiStoreContract' `
            -Publisher 'CN=00000000-0000-0000-0000-000000000000' `
            -PublisherDisplayName 'p-darksy-r CI' `
            -SkipChecks `
            -SkipWpfSmoke

      - name: Materialize and smoke the x64 root app entrypoint
        shell: pwsh
        run: |
          .\scripts\update-local-app.ps1 -Force -SkipChecks
          $changes = @(git status --porcelain --untracked-files=all)
          if ($changes.Count -gt 0) {
            throw "Root app materialization changed tracked or visible workspace files: $($changes -join '; ')"
          }

  validate-arm64:
    name: Native Windows ARM64 validation
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Assert native ARM64 host
        shell: pwsh
        run: |
          $architecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($architecture -ne [Runtime.InteropServices.Architecture]::Arm64) {
            throw "LNS-REL-007: expected a native ARM64 runner; received $architecture."
          }
          Write-Host "Native Windows ARM64 runner confirmed."

      - name: Build and test natively
        shell: pwsh
        run: .\scripts\check.ps1 -Configuration Release

      - name: Build and validate ephemeral ARM64 PrivateTest MSIX
        shell: pwsh
        run: |
          $certificate = .\scripts\new-private-test-certificate.ps1 `
            -OutputPath .\artifacts\ci-private-test-arm64.crt `
            -ValidityDays 90
          try {
            .\scripts\build-msix.ps1 `
              -Mode PrivateTest `
              -RuntimeIdentifier win-arm64 `
              -SigningCertificateThumbprint $certificate.Thumbprint `
              -PublicCertificatePath $certificate.PublicCertificatePath `
              -SkipChecks `
              -SkipWpfSmoke
          }
          finally {
            if ($certificate.Created) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Publish and smoke native ARM64 executables
        shell: pwsh
        run: .\scripts\publish-windows.ps1 -RuntimeIdentifier win-arm64 -SkipChecks

      - name: Materialize and smoke the ARM64 root app entrypoint
        shell: pwsh
        run: |
          .\scripts\update-local-app.ps1 -Force -SkipChecks
          $changes = @(git status --porcelain --untracked-files=all)
          if ($changes.Count -gt 0) {
            throw "Root app materialization changed tracked or visible workspace files: $($changes -join '; ')"
          }

  gate:
    name: CI gate
    if: ${{ !cancelled() }}
    needs: [validate, validate-arm64]
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Require every architecture check
        shell: pwsh
        env:
          X64_RESULT: ${{ needs.validate.result }}
          ARM64_RESULT: ${{ needs.validate-arm64.result }}
        run: |
          if ($env:X64_RESULT -ne 'success' -or $env:ARM64_RESULT -ne 'success') {
            throw "CI gate failed: x64=$env:X64_RESULT, arm64=$env:ARM64_RESULT."
          }
          Write-Host 'CI gate passed for x64 and native ARM64.'

