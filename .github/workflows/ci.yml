name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Restore, format, build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify copyright markers
        shell: pwsh
        run: .\scripts\check-copyright.ps1

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Show SDK information
        run: dotnet --info

      - name: Restore
        run: dotnet restore .\LocalNetworkScanner.slnx --nologo

      - name: Verify formatting
        run: dotnet format .\LocalNetworkScanner.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build Release
        run: dotnet build .\LocalNetworkScanner.slnx --configuration Release --no-restore --nologo

      - name: Run deterministic test harness
        run: dotnet run --project .\LocalNetworkScanner.Tests\LocalNetworkScanner.Tests.csproj --configuration Release --no-build

      - name: CLI smoke test
        run: dotnet run --project .\LocalNetworkScanner.Cli\LocalNetworkScanner.Cli.csproj --configuration Release --no-build -- --help

