name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release (requires running from a matching vX.Y.Z tag)
        required: true
        type: boolean
        default: false
      sign_release:
        description: Sign with the configured trusted RSA Authenticode certificate
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build Windows packages
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      signing_state: ${{ steps.signing.outputs.state }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify copyright markers
        shell: pwsh
        run: .\scripts\check-copyright.ps1

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate tag and project version
        id: version
        shell: pwsh
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          [xml]$props = Get-Content -LiteralPath .\Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid Version in Directory.Build.props: '$version'"
          }

          $tag = $env:RELEASE_REF_NAME
          $isTag = $env:RELEASE_REF_TYPE -eq 'tag'
          if ($isTag -and $tag -ne "v$version") {
            throw "Tag '$tag' does not match project version 'v$version'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "is_tag=$($isTag.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Validate source
        shell: pwsh
        run: .\scripts\check.ps1 -Configuration Release -VerifyFormat

      - name: Prepare optional Authenticode signing
        id: signing
        shell: pwsh
        env:
          AUTHENTICODE_ENABLED: ${{ vars.AUTHENTICODE_ENABLED }}
          DISPATCH_SIGN_RELEASE: ${{ inputs.sign_release }}
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        run: |
          $requested =
            $env:AUTHENTICODE_ENABLED -eq 'true' -or
            $env:DISPATCH_SIGN_RELEASE -eq 'true'
          if (-not $requested) {
            'enabled=false' >> $env:GITHUB_OUTPUT
            'state=NotSigned' >> $env:GITHUB_OUTPUT
            Write-Host 'Authenticode signing was not requested. Release state: NotSigned.'
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:AUTHENTICODE_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:AUTHENTICODE_PFX_PASSWORD)) {
            throw 'Authenticode signing was requested, but AUTHENTICODE_PFX_BASE64 or AUTHENTICODE_PFX_PASSWORD is missing.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'LocalNetworkScanner-Authenticode.pfx'
          $thumbprintsPath = Join-Path $env:RUNNER_TEMP 'LocalNetworkScanner-Authenticode-thumbprints.txt'
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:AUTHENTICODE_PFX_BASE64))
          }
          catch {
            throw "AUTHENTICODE_PFX_BASE64 is not valid Base64: $($_.Exception.Message)"
          }

          $password = ConvertTo-SecureString $env:AUTHENTICODE_PFX_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -Password $password)
          if ($imported.Count -eq 0) {
            throw 'The PFX did not import any certificates.'
          }
          $imported.Thumbprint | Set-Content -LiteralPath $thumbprintsPath -Encoding ascii

          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          $candidates = @($imported | Where-Object {
            $_.HasPrivateKey -and
            $null -ne ($_.Extensions |
              Where-Object { $_.Oid.Value -eq '2.5.29.37' -and
                @($_.EnhancedKeyUsages | Where-Object { $_.Value -eq $codeSigningOid }).Count -gt 0
              } |
              Select-Object -First 1)
          })
          if ($candidates.Count -ne 1) {
            throw "Expected exactly one private-key Code Signing certificate in the PFX; found $($candidates.Count)."
          }
          $certificate = $candidates[0]
          if ($certificate.Subject -eq $certificate.Issuer) {
            throw 'A self-signed certificate is not accepted for public release signing.'
          }
          $rsa = [Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($certificate)
          if ($null -eq $rsa) {
            throw 'The Code Signing certificate is not RSA.'
          }
          $rsa.Dispose()

          $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
          try {
            $chain.ChainPolicy.RevocationMode =
              [Security.Cryptography.X509Certificates.X509RevocationMode]::Online
            $chain.ChainPolicy.RevocationFlag =
              [Security.Cryptography.X509Certificates.X509RevocationFlag]::ExcludeRoot
            $chain.ChainPolicy.VerificationFlags =
              [Security.Cryptography.X509Certificates.X509VerificationFlags]::NoFlag
            $chain.ChainPolicy.UrlRetrievalTimeout = [TimeSpan]::FromSeconds(30)
            if (-not $chain.Build($certificate)) {
              $errors = ($chain.ChainStatus |
                ForEach-Object { "$($_.Status): $($_.StatusInformation.Trim())" }) -join '; '
              throw "The signing certificate did not build to a trusted CA: $errors"
            }
          }
          finally {
            $chain.Dispose()
          }

          $signTool = Get-ChildItem `
            -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse `
            -File `
            -Filter 'signtool.exe' |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) {
            throw 'Authenticode signing was requested, but x64 signtool.exe was not found in the Windows SDK.'
          }

          "thumbprint=$($certificate.Thumbprint.ToUpperInvariant())" >> $env:GITHUB_OUTPUT
          "signtool=$($signTool.FullName)" >> $env:GITHUB_OUTPUT
          'enabled=true' >> $env:GITHUB_OUTPUT
          'state=Signed' >> $env:GITHUB_OUTPUT
          Write-Host "Authenticode signing enabled for subject: $($certificate.Subject)"

      - name: Validate public release policy
        if: steps.version.outputs.is_tag == 'true' && (github.event_name == 'push' || inputs.publish_release)
        shell: pwsh
        env:
          SIGNING_STATE: ${{ steps.signing.outputs.state }}
          IEEE_REDISTRIBUTION_APPROVED: ${{ vars.IEEE_REDISTRIBUTION_APPROVED }}
        run: |
          if ($env:SIGNING_STATE -ne 'Signed') {
            throw 'Public releases require a valid trusted Authenticode signature. Generate private workflow artifacts instead.'
          }
          if ($env:IEEE_REDISTRIBUTION_APPROVED -ne 'true') {
            throw 'Public releases containing the bundled IEEE snapshot require repository variable IEEE_REDISTRIBUTION_APPROVED=true after written authorization has been archived.'
          }
          Write-Host 'Public release gates passed: Authenticode Signed and IEEE redistribution approved.'

      - name: Publish win-x64 portable package
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
          SIGNTOOL_PATH: ${{ steps.signing.outputs.signtool }}
        run: |
          $publishParameters = @{
            RuntimeIdentifier = 'win-x64'
            SkipChecks = $true
          }
          if ($env:SIGNING_ENABLED -eq 'true') {
            $publishParameters.SigningCertificateThumbprint = $env:SIGNING_THUMBPRINT
            $publishParameters.SignToolPath = $env:SIGNTOOL_PATH
          }
          .\scripts\publish-windows.ps1 @publishParameters

      - name: Publish win-arm64 portable package
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
          SIGNTOOL_PATH: ${{ steps.signing.outputs.signtool }}
        run: |
          $publishParameters = @{
            RuntimeIdentifier = 'win-arm64'
            SkipChecks = $true
            SkipWpfSmoke = $true
          }
          if ($env:SIGNING_ENABLED -eq 'true') {
            $publishParameters.SigningCertificateThumbprint = $env:SIGNING_THUMBPRINT
            $publishParameters.SignToolPath = $env:SIGNTOOL_PATH
          }
          .\scripts\publish-windows.ps1 @publishParameters

      - name: Install and verify Inno Setup 6.7.3
        id: inno
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          $uri = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $uri -OutFile $download

          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Inno Setup signature validation failed: status=$($signature.Status)."
          }
          $publisher = $signature.SignerCertificate.GetNameInfo(
            [Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
            $false)
          if ($publisher -ne 'Pyrsys B.V.') {
            throw "Unexpected Inno Setup publisher: '$publisher'."
          }

          $process = Start-Process -FilePath $download -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/CURRENTUSER',
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with code $($process.ExitCode)."
          }

          $iscc = Join-Path $installDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "ISCC.exe was not installed at the expected path: $iscc"
          }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Build win-x64 installer
        shell: pwsh
        env:
          ISCC_PATH: ${{ steps.inno.outputs.path }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
          SIGNTOOL_PATH: ${{ steps.signing.outputs.signtool }}
        run: |
          $installerParameters = @{
            RuntimeIdentifier = 'win-x64'
            SkipPublish = $true
            IsccPath = $env:ISCC_PATH
          }
          if ($env:SIGNING_ENABLED -eq 'true') {
            $installerParameters.SigningCertificateThumbprint = $env:SIGNING_THUMBPRINT
            $installerParameters.SignToolPath = $env:SIGNTOOL_PATH
          }
          .\scripts\build-installer.ps1 @installerParameters

      - name: Build win-arm64 installer
        shell: pwsh
        env:
          ISCC_PATH: ${{ steps.inno.outputs.path }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
          SIGNTOOL_PATH: ${{ steps.signing.outputs.signtool }}
        run: |
          $installerParameters = @{
            RuntimeIdentifier = 'win-arm64'
            SkipPublish = $true
            IsccPath = $env:ISCC_PATH
          }
          if ($env:SIGNING_ENABLED -eq 'true') {
            $installerParameters.SigningCertificateThumbprint = $env:SIGNING_THUMBPRINT
            $installerParameters.SignToolPath = $env:SIGNTOOL_PATH
          }
          .\scripts\build-installer.ps1 @installerParameters

      - name: Create combined checksum manifest
        shell: pwsh
        env:
          SIGNING_STATE: ${{ steps.signing.outputs.state }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = Get-ChildItem .\artifacts\release -File |
            Where-Object { $_.Extension -in '.zip', '.exe' } |
            Sort-Object Name
          if ($files.Count -ne 4) {
            throw "Expected 4 release binaries (2 ZIPs and 2 installers), found $($files.Count)."
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          Set-Content -LiteralPath .\artifacts\release\SHA256SUMS.txt -Value $lines -Encoding ascii
          @(
            "Version: $env:RELEASE_VERSION",
            "Authenticode: $env:SIGNING_STATE",
            'Verification: Get-AuthenticodeSignature and signtool verify /pa /tw'
          ) | Set-Content -LiteralPath .\artifacts\release\SIGNING-STATE.txt -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LocalNetworkScanner-${{ steps.version.outputs.version }}-windows
          path: |
            artifacts/release/*.zip
            artifacts/release/*.exe
            artifacts/release/*.sha256
            artifacts/release/SHA256SUMS.txt
            artifacts/release/SIGNING-STATE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral signing material
        if: always()
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'LocalNetworkScanner-Authenticode.pfx'
          $thumbprintsPath = Join-Path $env:RUNNER_TEMP 'LocalNetworkScanner-Authenticode-thumbprints.txt'
          if (Test-Path -LiteralPath $thumbprintsPath -PathType Leaf) {
            foreach ($thumbprint in Get-Content -LiteralPath $thumbprintsPath) {
              if ($thumbprint -match '^[0-9A-Fa-f]{40}$') {
                Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
              }
            }
          }
          Remove-Item -LiteralPath $pfxPath, $thumbprintsPath -Force -ErrorAction SilentlyContinue

  publish:
    name: Publish immutable GitHub Release
    if: needs.package.outputs.is_tag == 'true' && (github.event_name == 'push' || inputs.publish_release)
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download validated release artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name "LocalNetworkScanner-$env:RELEASE_VERSION-windows" `
            --dir .\artifacts\release
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to download the validated release artifact from this workflow run.'
          }

      - name: Revalidate release payload
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $releaseRoot = (Resolve-Path .\artifacts\release).Path
          $binaryNames = @(
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-x64.zip",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-arm64.zip",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-x64-setup.exe",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-arm64-setup.exe"
          )
          $expectedNames = @(
            $binaryNames
            $binaryNames | ForEach-Object { "$_.sha256" }
            'SHA256SUMS.txt'
            'SIGNING-STATE.txt'
          ) | Sort-Object
          $actualNames = @(
            Get-ChildItem -LiteralPath $releaseRoot -File |
              Select-Object -ExpandProperty Name |
              Sort-Object)
          $payloadDifference = @(
            Compare-Object -ReferenceObject $expectedNames -DifferenceObject $actualNames)
          if ($payloadDifference.Count -ne 0) {
            throw "Release payload does not match the exact 10-file contract: $($payloadDifference | Out-String)"
          }

          $manifestLines = @(Get-Content -LiteralPath (Join-Path $releaseRoot 'SHA256SUMS.txt'))
          if ($manifestLines.Count -ne $binaryNames.Count) {
            throw "SHA256SUMS.txt must contain exactly $($binaryNames.Count) entries."
          }
          foreach ($binaryName in $binaryNames) {
            $binaryPath = Join-Path $releaseRoot $binaryName
            $expectedLine = '{0} *{1}' -f (
              Get-FileHash -LiteralPath $binaryPath -Algorithm SHA256
            ).Hash.ToLowerInvariant(), $binaryName
            $individualLine = (
              Get-Content -LiteralPath "$binaryPath.sha256" -Raw
            ).Trim()
            if ($individualLine -cne $expectedLine) {
              throw "Individual checksum mismatch for $binaryName."
            }
            if ($manifestLines -cnotcontains $expectedLine) {
              throw "Combined checksum manifest mismatch for $binaryName."
            }
          }

          $signingState = @(
            Get-Content -LiteralPath (Join-Path $releaseRoot 'SIGNING-STATE.txt'))
          if ($signingState -cnotcontains "Version: $env:RELEASE_VERSION" -or
              $signingState -cnotcontains 'Authenticode: Signed') {
            throw 'SIGNING-STATE.txt does not identify this version as Authenticode Signed.'
          }

          function Assert-ValidSignature {
            param([Parameter(Mandatory = $true)][string]$Path)
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($signature.Status -ne 'Valid' -or
                $null -eq $signature.SignerCertificate -or
                $null -eq $signature.TimeStamperCertificate) {
              throw "Authenticode revalidation failed for '$Path': status=$($signature.Status)."
            }
            return $signature.SignerCertificate.Thumbprint
          }

          $signerThumbprints = @()
          foreach ($installerName in $binaryNames | Where-Object { $_.EndsWith('-setup.exe') }) {
            $signerThumbprints += Assert-ValidSignature (Join-Path $releaseRoot $installerName)
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'LocalNetworkScanner-release-revalidation'
          try {
            foreach ($archiveName in $binaryNames | Where-Object { $_.EndsWith('.zip') }) {
              $destination = Join-Path $extractRoot $archiveName
              Expand-Archive -LiteralPath (Join-Path $releaseRoot $archiveName) `
                -DestinationPath $destination
              $executables = @(Get-ChildItem -LiteralPath $destination -Recurse -File -Filter *.exe)
              if ($executables.Count -ne 2 -or
                  $executables.Name -notcontains 'LocalNetworkScanner.exe' -or
                  $executables.Name -notcontains 'LocalNetworkScanner.Cli.exe') {
                throw "Archive $archiveName does not contain exactly the expected UI and CLI executables."
              }
              foreach ($executable in $executables) {
                $signerThumbprints += Assert-ValidSignature $executable.FullName
              }
            }
          }
          finally {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

          $uniqueSigners = @($signerThumbprints | Sort-Object -Unique)
          if ($uniqueSigners.Count -ne 1) {
            throw 'Release executables do not share one Authenticode signer.'
          }
          Write-Host "Release payload revalidated with signer $($uniqueSigners[0])."

      - name: Publish signed immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          SIGNING_STATE: ${{ needs.package.outputs.signing_state }}
        run: |
          if ($env:SIGNING_STATE -ne 'Signed') {
            throw 'The publish job received an artifact that is not Authenticode Signed.'
          }
          $notes = @(
            "Windows desktop release $env:RELEASE_VERSION.",
            '',
            '- `win-x64`: Windows 11 e edições Windows 10 LTSC/Enterprise atualmente suportadas pelo .NET 10.',
            '- `win-arm64`: Windows 11 em computadores ARM64 (cross-build; validação em hardware ARM64 nativo ainda pendente).',
            '- `*-setup.exe`: instalador por utilizador.',
            '- `*.zip`: versão portátil, sem instalação.',
            '',
            'Authenticode: `Signed`. Valide o signer e o timestamp depois do download.',
            '',
            'O instalador não inicia automaticamente a aplicação. Se o Windows apresentar o código 4551, consulte `docs/APP_CONTROL.md`; não desative a política de Controlo de Aplicações.',
            'Consulte também o changelog e as limitações técnicas incluídos no pacote.'
          ) -join [Environment]::NewLine

          $binaryNames = @(
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-x64.zip",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-arm64.zip",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-x64-setup.exe",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-arm64-setup.exe"
          )
          $assetNames = @(
            $binaryNames
            $binaryNames | ForEach-Object { "$_.sha256" }
            'SHA256SUMS.txt'
            'SIGNING-STATE.txt'
          )
          $assets = @($assetNames | ForEach-Object {
            (Resolve-Path (Join-Path .\artifacts\release $_)).Path
          })

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists. Published release assets are immutable; create a new version instead."
          }

          gh release create $env:RELEASE_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "Local Network Scanner $env:RELEASE_VERSION" `
            --notes $notes `
            --draft `
            --verify-tag
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create draft release $env:RELEASE_TAG."
          }

          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw "Release $env:RELEASE_TAG remains a draft because final publication failed."
          }

