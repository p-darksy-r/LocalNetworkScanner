name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release (requires running from a matching vX.Y.Z tag)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build Windows packages
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify copyright markers
        shell: pwsh
        run: .\scripts\check-copyright.ps1

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate tag and project version
        id: version
        shell: pwsh
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          [xml]$props = Get-Content -LiteralPath .\Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid Version in Directory.Build.props: '$version'"
          }

          $tag = $env:RELEASE_REF_NAME
          $isTag = $env:RELEASE_REF_TYPE -eq 'tag'
          if ($isTag -and $tag -ne "v$version") {
            throw "Tag '$tag' does not match project version 'v$version'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "is_tag=$($isTag.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Validate source
        shell: pwsh
        run: .\scripts\check.ps1 -Configuration Release -VerifyFormat

      - name: Publish win-x64 portable package
        shell: pwsh
        run: .\scripts\publish-windows.ps1 -RuntimeIdentifier win-x64 -SkipChecks

      - name: Publish win-arm64 portable package
        shell: pwsh
        run: .\scripts\publish-windows.ps1 -RuntimeIdentifier win-arm64 -SkipChecks -SkipWpfSmoke

      - name: Install and verify Inno Setup 6.7.3
        id: inno
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          $uri = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $uri -OutFile $download

          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Inno Setup signature validation failed: status=$($signature.Status)."
          }
          $publisher = $signature.SignerCertificate.GetNameInfo(
            [Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
            $false)
          if ($publisher -ne 'Pyrsys B.V.') {
            throw "Unexpected Inno Setup publisher: '$publisher'."
          }

          $process = Start-Process -FilePath $download -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/CURRENTUSER',
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with code $($process.ExitCode)."
          }

          $iscc = Join-Path $installDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "ISCC.exe was not installed at the expected path: $iscc"
          }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Build win-x64 installer
        shell: pwsh
        env:
          ISCC_PATH: ${{ steps.inno.outputs.path }}
        run: .\scripts\build-installer.ps1 -RuntimeIdentifier win-x64 -SkipPublish -IsccPath $env:ISCC_PATH

      - name: Build win-arm64 installer
        shell: pwsh
        env:
          ISCC_PATH: ${{ steps.inno.outputs.path }}
        run: .\scripts\build-installer.ps1 -RuntimeIdentifier win-arm64 -SkipPublish -IsccPath $env:ISCC_PATH

      - name: Create combined checksum manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem .\artifacts\release -File |
            Where-Object { $_.Extension -in '.zip', '.exe' } |
            Sort-Object Name
          if ($files.Count -ne 4) {
            throw "Expected 4 release binaries (2 ZIPs and 2 installers), found $($files.Count)."
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          Set-Content -LiteralPath .\artifacts\release\SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LocalNetworkScanner-${{ steps.version.outputs.version }}-windows
          path: |
            artifacts/release/*.zip
            artifacts/release/*.exe
            artifacts/release/*.sha256
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.version.outputs.is_tag == 'true' && (github.event_name == 'push' || inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = @(
            "Windows desktop release $env:RELEASE_VERSION.",
            '',
            '- `win-x64`: Windows 10/11 em computadores Intel/AMD de 64 bits.',
            '- `win-arm64`: Windows 11 em computadores ARM64.',
            '- `*-setup.exe`: instalador por utilizador.',
            '- `*.zip`: versão portátil, sem instalação.',
            '',
            'Os binários deste workflow não têm assinatura Authenticode. Confirme o ficheiro `SHA256SUMS.txt` antes de executar. Consulte o changelog e as limitações técnicas incluídos no pacote.'
          ) -join [Environment]::NewLine
          gh release create $env:RELEASE_TAG .\artifacts\release\*.zip .\artifacts\release\*.exe .\artifacts\release\*.sha256 .\artifacts\release\SHA256SUMS.txt --title "Local Network Scanner $env:RELEASE_VERSION" --notes $notes --verify-tag

