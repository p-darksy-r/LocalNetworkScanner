name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a signed GitHub Release (requires a matching vX.Y.Z tag at the current main commit)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-storage-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release request and trust gates
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.preflight.outputs.version }}
      is_tag: ${{ steps.preflight.outputs.is_tag }}
      public_release: ${{ steps.preflight.outputs.public_release }}
      private_release: ${{ steps.preflight.outputs.private_release }}
      run_candidate: ${{ steps.preflight.outputs.run_candidate }}

    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version, main provenance and external gates
        id: preflight
        shell: pwsh
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          PUBLIC_RELEASE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_SIGNING_ENABLED: ${{ vars.ARTIFACT_SIGNING_ENABLED }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_RESOURCE_GROUP: ${{ vars.ARTIFACT_SIGNING_RESOURCE_GROUP }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          IEEE_REDISTRIBUTION_APPROVED: ${{ vars.IEEE_REDISTRIBUTION_APPROVED }}
        run: |
          [xml]$props = Get-Content -LiteralPath .\Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "LNS-REL-009: invalid Version in Directory.Build.props: '$version'."
          }

          $isTag = $env:RELEASE_REF_TYPE -eq 'tag'
          $publicRelease = $env:PUBLIC_RELEASE_REQUESTED -eq 'true'
          $blockers = [Collections.Generic.List[object]]::new()
          $liveVisibilityResponse = @(
            gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private' 2>&1
          )
          $liveVisibility = ($liveVisibilityResponse -join '').Trim().ToLowerInvariant()
          $repositoryIsPrivateLive = $LASTEXITCODE -eq 0 -and $liveVisibility -eq 'true'
          if ($LASTEXITCODE -ne 0 -or $liveVisibility -notin @('true', 'false')) {
            $blockers.Add([pscustomobject]@{
              Code = 'LNS-REL-005'
              Message = 'Unable to establish the live repository visibility through the GitHub API.'
            })
          }
          if ($isTag -and $env:RELEASE_REF_NAME -ne "v$version") {
            $blockers.Add([pscustomobject]@{
              Code = 'LNS-REL-009'
              Message = "Tag '$env:RELEASE_REF_NAME' does not match project version 'v$version'."
            })
          }
          if ($publicRelease -and -not $isTag) {
            $blockers.Add([pscustomobject]@{
              Code = 'LNS-REL-009'
              Message = 'A public release can only be requested from its matching vX.Y.Z tag.'
            })
          }
          if (-not $isTag -and
              -not $publicRelease -and
              (-not $repositoryIsPrivateLive -or $env:REPOSITORY_PRIVATE -ne 'true')) {
            $blockers.Add([pscustomobject]@{
              Code = 'LNS-REL-005'
              Message = 'A NotSigned QA candidate may only be built and uploaded while the repository is private.'
            })
          }

          $currentShaOutput = @(git rev-parse HEAD 2>&1)
          $currentShaExitCode = $LASTEXITCODE
          $currentSha = if ($currentShaExitCode -eq 0) {
            ([string]($currentShaOutput -join '')).Trim()
          }
          else {
            ''
          }
          $mainShaOutput = @(git rev-parse refs/remotes/origin/main 2>&1)
          $mainShaExitCode = $LASTEXITCODE
          $mainSha = if ($mainShaExitCode -eq 0) {
            ([string]($mainShaOutput -join '')).Trim()
          }
          else {
            ''
          }
          if ($currentShaExitCode -ne 0 -or
              $mainShaExitCode -ne 0 -or
              [string]::IsNullOrWhiteSpace($currentSha) -or
              [string]::IsNullOrWhiteSpace($mainSha) -or
              $currentSha -ne $mainSha) {
            $blockers.Add([pscustomobject]@{
              Code = 'LNS-REL-009'
              Message = "Release workflows must use the current main commit. ref=$currentSha main=$mainSha"
            })
          }

          if ($publicRelease -and $env:ARTIFACT_SIGNING_ENABLED -ne 'true') {
            $blockers.Add([pscustomobject]@{
              Code = 'LNS-REL-001'
              Message = 'Public release requested without Microsoft Artifact Signing enabled.'
            })
          }
          $requiredSigningSettings = @(
            'ARTIFACT_SIGNING_ENDPOINT',
            'ARTIFACT_SIGNING_RESOURCE_GROUP',
            'ARTIFACT_SIGNING_ACCOUNT',
            'ARTIFACT_SIGNING_PROFILE',
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID'
          )
          $missingSigningSettings = @($requiredSigningSettings | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($publicRelease -and $missingSigningSettings.Count -gt 0) {
            $blockers.Add([pscustomobject]@{
              Code = 'LNS-REL-002'
              Message = "Artifact Signing/OIDC configuration is incomplete: $($missingSigningSettings -join ', ')."
            })
          }
          if ($publicRelease -and $env:IEEE_REDISTRIBUTION_APPROVED -ne 'true') {
            $blockers.Add([pscustomobject]@{
              Code = 'LNS-REL-006'
              Message = 'Bundled IEEE data cannot be redistributed publicly until written authorization is archived and IEEE_REDISTRIBUTION_APPROVED=true.'
            })
          }

          $productionGatesConfigured =
            $env:ARTIFACT_SIGNING_ENABLED -eq 'true' -and
            $missingSigningSettings.Count -eq 0 -and
            $env:IEEE_REDISTRIBUTION_APPROVED -eq 'true'
          $privateRelease =
            $isTag -and
            -not $publicRelease -and
            $env:REPOSITORY_PRIVATE -eq 'true' -and
            $repositoryIsPrivateLive -and
            -not $productionGatesConfigured
          $privateBranchCandidate =
            -not $isTag -and
            -not $publicRelease -and
            $env:REPOSITORY_PRIVATE -eq 'true' -and
            $repositoryIsPrivateLive
          $runCandidate = $publicRelease -or $privateRelease -or $privateBranchCandidate

          @(
            '## Windows release trust preflight',
            '',
            "- Version: ``$version``",
            "- Current commit equals ``origin/main``: ``$($currentSha -eq $mainSha)``",
            "- Matching tag: ``$isTag``",
            "- Public release requested: ``$publicRelease``",
            "- Automatic private QA prerelease: ``$privateRelease``",
            "- Private branch QA candidate: ``$privateBranchCandidate``",
            "- Repository private (event/live): ``$($env:REPOSITORY_PRIVATE -eq 'true')/$repositoryIsPrivateLive``",
            "- Production gates configured: ``$productionGatesConfigured``",
            "- Build candidate in this run: ``$runCandidate``",
            "- Artifact Signing enabled: ``$($env:ARTIFACT_SIGNING_ENABLED -eq 'true')``",
            "- Artifact Signing/OIDC configuration complete: ``$($missingSigningSettings.Count -eq 0)``",
            "- IEEE redistribution approved: ``$($env:IEEE_REDISTRIBUTION_APPROVED -eq 'true')``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          foreach ($blocker in $blockers) {
            Write-Host "::error title=$($blocker.Code)::$($blocker.Message)"
          }
          if ($blockers.Count -gt 0) {
            throw "Release preflight failed with $($blockers.Count) blocking condition(s). See docs/SIGNING.md."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "is_tag=$($isTag.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "public_release=$($publicRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "private_release=$($privateRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "run_candidate=$($runCandidate.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release preflight passed for trusted main commit $currentSha."

  package-private-qa:
    name: Build unsigned private QA packages
    if: needs.preflight.outputs.run_candidate == 'true' && needs.preflight.outputs.public_release != 'true'
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 50
    environment:
      name: private-qa
    permissions:
      contents: read
    outputs:
      version: ${{ needs.preflight.outputs.version }}
      is_tag: ${{ needs.preflight.outputs.is_tag }}
      signing_state: ${{ steps.manifest.outputs.signing_state }}
      candidate_digest: ${{ steps.candidate.outputs.artifact-digest }}

    steps: &package-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate source
        shell: pwsh
        run: .\scripts\check.ps1 -Configuration Release -VerifyFormat

      - name: Validate immutable GitHub OIDC claims
        if: needs.preflight.outputs.public_release == 'true'
        shell: pwsh
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          $repositoryName = ($env:GITHUB_REPOSITORY -split '/', 2)[1]
          if ([string]::IsNullOrWhiteSpace($repositoryName) -or
              [string]::IsNullOrWhiteSpace($env:REPOSITORY_OWNER_ID) -or
              [string]::IsNullOrWhiteSpace($env:REPOSITORY_ID)) {
            throw 'LNS-REL-002: GitHub did not expose immutable repository owner/repository IDs.'
          }
          $expectedSubject = "repo:$env:REPOSITORY_OWNER@$env:REPOSITORY_OWNER_ID/$repositoryName@$env:REPOSITORY_ID:environment:release-signing"
          $audience = 'api://AzureADTokenExchange'
          $tokenResponse = Invoke-RestMethod `
            -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$([Uri]::EscapeDataString($audience))" `
            -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          $tokenParts = ([string]$tokenResponse.value).Split('.')
          if ($tokenParts.Count -ne 3) {
            throw 'LNS-REL-002: GitHub returned a malformed OIDC token.'
          }
          $payload = $tokenParts[1].Replace('-', '+').Replace('_', '/')
          switch ($payload.Length % 4) {
            2 { $payload += '==' }
            3 { $payload += '=' }
            1 { throw 'LNS-REL-002: GitHub returned an invalid OIDC token payload.' }
          }
          $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) |
            ConvertFrom-Json
          if ([string]$claims.sub -cne $expectedSubject -or
              @($claims.aud) -cnotcontains $audience) {
            throw "LNS-REL-002: immutable OIDC claims do not match the release trust. subject='$($claims.sub)', audience='$($claims.aud -join ',')'."
          }
          Write-Host "Immutable OIDC subject validated: $expectedSubject"

      - name: Azure login with short-lived OIDC token
        if: needs.preflight.outputs.public_release == 'true'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        env:
          AZURE_LOGIN_PRE_CLEANUP: true
          AZURE_LOGIN_POST_CLEANUP: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Require an Artifact Signing Public Trust profile
        if: needs.preflight.outputs.public_release == 'true'
        shell: pwsh
        env:
          ARTIFACT_SIGNING_RESOURCE_GROUP: ${{ vars.ARTIFACT_SIGNING_RESOURCE_GROUP }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $escapedSubscription = [Uri]::EscapeDataString($env:AZURE_SUBSCRIPTION_ID)
          $escapedResourceGroup = [Uri]::EscapeDataString($env:ARTIFACT_SIGNING_RESOURCE_GROUP)
          $escapedAccount = [Uri]::EscapeDataString($env:ARTIFACT_SIGNING_ACCOUNT)
          $escapedProfile = [Uri]::EscapeDataString($env:ARTIFACT_SIGNING_PROFILE)
          $profileUri = "https://management.azure.com/subscriptions/$escapedSubscription/resourceGroups/$escapedResourceGroup/providers/Microsoft.CodeSigning/codeSigningAccounts/$escapedAccount/certificateProfiles/$escapedProfile`?api-version=2025-10-13"
          $profileOutput = @(az rest --method get --uri $profileUri --only-show-errors --output json 2>&1)
          $profileExitCode = $LASTEXITCODE
          if ($profileExitCode -ne 0) {
            throw "LNS-REL-002: unable to query the configured Artifact Signing profile through the Azure Resource Manager API: $($profileOutput -join [Environment]::NewLine)"
          }
          try {
            $profile = ($profileOutput -join [Environment]::NewLine) | ConvertFrom-Json
          }
          catch {
            throw "LNS-REL-002: Azure returned an invalid Artifact Signing profile response: $($_.Exception.Message)"
          }
          if ([string]$profile.properties.profileType -cne 'PublicTrust') {
            throw "LNS-REL-002: public releases require an Artifact Signing PublicTrust profile; configured type='$($profile.properties.profileType)'."
          }
          Write-Host "Artifact Signing profile '$env:ARTIFACT_SIGNING_PROFILE' is PublicTrust."

      - name: Install pinned Artifact Signing client
        if: needs.preflight.outputs.public_release == 'true'
        shell: pwsh
        run: |
          Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Force -Repository PSGallery
          $module = Get-Module -ListAvailable -Name ArtifactSigning |
            Where-Object { $_.Version -eq [Version]'0.1.8' } |
            Select-Object -First 1
          if ($null -eq $module) {
            throw 'LNS-REL-003: ArtifactSigning PowerShell module 0.1.8 was not installed.'
          }
          Write-Host "Artifact Signing client: $($module.Path)"

      - name: Reconfirm private boundary before unsigned package generation
        if: needs.preflight.outputs.public_release != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $visibilityResponse = @(
            gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private' 2>&1
          )
          if ($LASTEXITCODE -ne 0 -or
              ($visibilityResponse -join '').Trim().ToLowerInvariant() -ne 'true') {
            throw 'LNS-REL-005: live repository visibility is not private; refusing to generate NotSigned packages.'
          }

      - name: Publish win-x64 portable package
        shell: pwsh
        env:
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $parameters = @{
            RuntimeIdentifier = 'win-x64'
            SkipChecks = $true
          }
          if ($env:PUBLIC_RELEASE -eq 'true') {
            $parameters.ExternalSignerScript = '.\scripts\invoke-artifact-signing.ps1'
          }
          .\scripts\publish-windows.ps1 @parameters

      - name: Publish win-arm64 portable package
        shell: pwsh
        env:
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $parameters = @{
            RuntimeIdentifier = 'win-arm64'
            SkipChecks = $true
            SkipWpfSmoke = $true
          }
          if ($env:PUBLIC_RELEASE -eq 'true') {
            $parameters.ExternalSignerScript = '.\scripts\invoke-artifact-signing.ps1'
          }
          .\scripts\publish-windows.ps1 @parameters

      - name: Install and verify Inno Setup 6.7.3
        id: inno
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          $uri = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $uri -OutFile $download

          $expectedSha256 = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          $actualSha256 = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash
          if ($actualSha256 -cne $expectedSha256) {
            throw "LNS-REL-003: Inno Setup SHA-256 mismatch; actual=$actualSha256 expected=$expectedSha256."
          }
          $productVersion = ([string](Get-Item -LiteralPath $download).VersionInfo.ProductVersion).Trim()
          if ($productVersion -cne '6.7.3') {
            throw "LNS-REL-003: unexpected Inno Setup ProductVersion: '$productVersion'."
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "LNS-REL-003: Inno Setup signature validation failed: status=$($signature.Status)."
          }
          $publisher = $signature.SignerCertificate.GetNameInfo(
            [Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
            $false)
          if ($publisher -ne 'Pyrsys B.V.') {
            throw "LNS-REL-003: unexpected Inno Setup publisher: '$publisher'."
          }

          $process = Start-Process -FilePath $download -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/CURRENTUSER',
            "/DIR=$installDir"
          ) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "LNS-REL-003: Inno Setup installation failed with code $($process.ExitCode)."
          }
          $process.Dispose()

          $iscc = Join-Path $installDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "LNS-REL-003: ISCC.exe was not installed at the expected path: $iscc"
          }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Build win-x64 installer
        shell: pwsh
        env:
          ISCC_PATH: ${{ steps.inno.outputs.path }}
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $parameters = @{
            RuntimeIdentifier = 'win-x64'
            SkipPublish = $true
            IsccPath = $env:ISCC_PATH
          }
          if ($env:PUBLIC_RELEASE -eq 'true') {
            $parameters.ExternalSignerScript = '.\scripts\invoke-artifact-signing.ps1'
          }
          .\scripts\build-installer.ps1 @parameters

      - name: Build win-arm64 installer
        shell: pwsh
        env:
          ISCC_PATH: ${{ steps.inno.outputs.path }}
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $parameters = @{
            RuntimeIdentifier = 'win-arm64'
            SkipPublish = $true
            IsccPath = $env:ISCC_PATH
          }
          if ($env:PUBLIC_RELEASE -eq 'true') {
            $parameters.ExternalSignerScript = '.\scripts\invoke-artifact-signing.ps1'
          }
          .\scripts\build-installer.ps1 @parameters

      - name: Create candidate manifest and revalidate signatures
        id: manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
        run: |
          $releaseRoot = (Resolve-Path .\artifacts\release).Path
          $binaryNames = @(
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-x64.zip",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-arm64.zip",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-x64-setup.exe",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-arm64-setup.exe"
          )
          $files = @(Get-ChildItem -LiteralPath $releaseRoot -File |
            Where-Object { $_.Name -in $binaryNames } |
            Sort-Object Name)
          if ($files.Count -ne 4) {
            throw "LNS-REL-008: expected 4 release binaries, found $($files.Count)."
          }

          $manifestLines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = "$hash *$($file.Name)"
            if ((Get-Content -LiteralPath "$($file.FullName).sha256" -Raw).Trim() -cne $line) {
              throw "LNS-REL-008: individual checksum mismatch for $($file.Name)."
            }
            $line
          }
          Set-Content -LiteralPath (Join-Path $releaseRoot 'SHA256SUMS.txt') -Value $manifestLines -Encoding ascii

          $signingState = 'NotSigned'
          if ($env:PUBLIC_RELEASE -eq 'true') {
            $signerThumbprints = @()
            function Assert-ValidSignature {
              param([Parameter(Mandatory = $true)][string]$Path)
              $signature = Get-AuthenticodeSignature -LiteralPath $Path
              if ($signature.Status -ne 'Valid' -or
                  $null -eq $signature.SignerCertificate -or
                  $null -eq $signature.TimeStamperCertificate) {
                throw "LNS-REL-005: signature validation failed for '$Path': status=$($signature.Status)."
              }
              return $signature.SignerCertificate.Thumbprint
            }

            foreach ($installer in $files | Where-Object { $_.Name.EndsWith('-setup.exe') }) {
              $signerThumbprints += Assert-ValidSignature $installer.FullName
            }
            $verifyRoot = Join-Path $env:RUNNER_TEMP 'LocalNetworkScanner-signature-revalidation'
            try {
              foreach ($archive in $files | Where-Object { $_.Extension -eq '.zip' }) {
                $destination = Join-Path $verifyRoot $archive.BaseName
                Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination
                $packageRoot = Join-Path $destination $archive.BaseName
                $expectedSignablePaths = @(
                  'LocalNetworkScanner.Cli.exe',
                  'LocalNetworkScanner.exe',
                  'tools/diagnose-app-control.ps1'
                ) | Sort-Object
                $signableExtensions = @(
                  '.appx', '.cat', '.dll', '.exe', '.msi', '.msix', '.ocx',
                  '.ps1', '.psd1', '.psm1', '.sys'
                )
                if (-not (Test-Path -LiteralPath $packageRoot -PathType Container)) {
                  throw "LNS-REL-008: archive $($archive.Name) is missing its exact package root."
                }
                $actualSignablePaths = @(
                  Get-ChildItem -LiteralPath $packageRoot -Recurse -File |
                    Where-Object { $_.Extension.ToLowerInvariant() -in $signableExtensions } |
                    ForEach-Object {
                      [IO.Path]::GetRelativePath($packageRoot, $_.FullName).Replace('\', '/')
                    } |
                    Sort-Object
                )
                $contractDifference = @(
                  Compare-Object -ReferenceObject $expectedSignablePaths -DifferenceObject $actualSignablePaths
                )
                if ($contractDifference.Count -ne 0) {
                  throw "LNS-REL-008: archive $($archive.Name) differs from the exact signable-path contract: $($contractDifference | Out-String)"
                }
                foreach ($relativePath in $expectedSignablePaths) {
                  $signerThumbprints += Assert-ValidSignature (Join-Path $packageRoot $relativePath)
                }
              }
            }
            finally {
              Remove-Item -LiteralPath $verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
            if (@($signerThumbprints | Sort-Object -Unique).Count -ne 1) {
              throw 'LNS-REL-005: release files do not share one Artifact Signing identity.'
            }
            $signingState = 'Signed'
          }

          @(
            "Version: $env:RELEASE_VERSION",
            "Authenticode: $signingState",
            'Native x64: Pending',
            'Native ARM64: Pending',
            "Release mode: $(if ($env:PUBLIC_RELEASE -eq 'true') { 'PublicRelease' } else { 'PrivateQa' })",
            "Signing backend: $(if ($env:PUBLIC_RELEASE -eq 'true') { 'Microsoft Artifact Signing OIDC' } else { 'None' })",
            'Verification: Get-AuthenticodeSignature and signtool verify /pa /tw'
          ) | Set-Content -LiteralPath (Join-Path $releaseRoot 'SIGNING-STATE.txt') -Encoding ascii
          "signing_state=$signingState" >> $env:GITHUB_OUTPUT

      - name: Reconfirm private boundary before NotSigned artifact upload
        if: needs.preflight.outputs.public_release != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $visibilityResponse = @(
            gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private' 2>&1
          )
          if ($LASTEXITCODE -ne 0 -or
              ($visibilityResponse -join '').Trim().ToLowerInvariant() -ne 'true') {
            throw 'LNS-REL-005: live repository visibility is not private; refusing to upload a NotSigned candidate.'
          }

      - name: Upload unvalidated candidate
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LocalNetworkScanner-${{ needs.preflight.outputs.version }}-windows-candidate
          path: |
            artifacts/release/*.zip
            artifacts/release/*.exe
            artifacts/release/*.sha256
            artifacts/release/SHA256SUMS.txt
            artifacts/release/SIGNING-STATE.txt
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 1

  package-public:
    name: Build and sign public Windows packages
    if: needs.preflight.outputs.public_release == 'true'
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 50
    environment:
      name: release-signing
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ needs.preflight.outputs.version }}
      is_tag: ${{ needs.preflight.outputs.is_tag }}
      signing_state: ${{ steps.manifest.outputs.signing_state }}
      candidate_digest: ${{ steps.candidate.outputs.artifact-digest }}
    steps: *package-steps

  package:
    name: Select isolated release package path
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.run_candidate == 'true' }}
    needs: [preflight, package-private-qa, package-public]
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      signing_state: ${{ steps.select.outputs.signing_state }}
      candidate_digest: ${{ steps.select.outputs.candidate_digest }}
    steps:
      - name: Require exactly the intended package job
        id: select
        shell: pwsh
        env:
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
          PRIVATE_RESULT: ${{ needs.package-private-qa.result }}
          PRIVATE_SIGNING_STATE: ${{ needs.package-private-qa.outputs.signing_state }}
          PRIVATE_CANDIDATE_DIGEST: ${{ needs.package-private-qa.outputs.candidate_digest }}
          PUBLIC_RESULT: ${{ needs.package-public.result }}
          PUBLIC_SIGNING_STATE: ${{ needs.package-public.outputs.signing_state }}
          PUBLIC_CANDIDATE_DIGEST: ${{ needs.package-public.outputs.candidate_digest }}
        run: |
          if ($env:PUBLIC_RELEASE -eq 'true') {
            if ($env:PUBLIC_RESULT -ne 'success' -or $env:PRIVATE_RESULT -ne 'skipped') {
              throw "LNS-REL-008: expected only the public signing path; public=$env:PUBLIC_RESULT private=$env:PRIVATE_RESULT."
            }
            $signingState = $env:PUBLIC_SIGNING_STATE
            $candidateDigest = $env:PUBLIC_CANDIDATE_DIGEST
          }
          else {
            if ($env:PRIVATE_RESULT -ne 'success' -or $env:PUBLIC_RESULT -ne 'skipped') {
              throw "LNS-REL-008: expected only the private QA path; private=$env:PRIVATE_RESULT public=$env:PUBLIC_RESULT."
            }
            $signingState = $env:PRIVATE_SIGNING_STATE
            $candidateDigest = $env:PRIVATE_CANDIDATE_DIGEST
          }
          if ([string]::IsNullOrWhiteSpace($signingState)) {
            throw 'LNS-REL-008: selected package path did not expose a signing state.'
          }
          if ($candidateDigest -notmatch '^(sha256:)?[0-9a-fA-F]{64}$') {
            throw 'LNS-REL-008: selected package path did not expose a valid SHA-256 artifact digest.'
          }
          "signing_state=$signingState" >> $env:GITHUB_OUTPUT
          "candidate_digest=$candidateDigest" >> $env:GITHUB_OUTPUT

  validate-x64:
    name: Validate exact x64 package and installer
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.package.result == 'success' }}
    needs: [preflight, package]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name "LocalNetworkScanner-$env:RELEASE_VERSION-windows-candidate" `
            --dir .\artifacts\release
          if ($LASTEXITCODE -ne 0) {
            throw 'LNS-REL-008: unable to download the exact candidate artifact.'
          }

      - name: Install, smoke and uninstall exact x64 assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
        run: |
          $parameters = @{
            Version = $env:RELEASE_VERSION
            RuntimeIdentifier = 'win-x64'
          }
          if ($env:PUBLIC_RELEASE -eq 'true') {
            $parameters.RequireSigned = $true
          }
          .\scripts\validate-release-package.ps1 @parameters

  validate-arm64:
    name: Validate exact package on native Windows ARM64
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.package.result == 'success' && needs.validate-x64.result == 'success' }}
    needs: [preflight, package, validate-x64]
    runs-on: windows-11-arm
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name "LocalNetworkScanner-$env:RELEASE_VERSION-windows-candidate" `
            --dir .\artifacts\release
          if ($LASTEXITCODE -ne 0) {
            throw 'LNS-REL-008: unable to download the exact candidate artifact.'
          }

      - name: Install, smoke and uninstall exact ARM64 assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
        run: |
          $parameters = @{
            Version = $env:RELEASE_VERSION
            RuntimeIdentifier = 'win-arm64'
          }
          if ($env:PUBLIC_RELEASE -eq 'true') {
            $parameters.RequireSigned = $true
          }
          .\scripts\validate-release-package.ps1 @parameters

      - name: Create compact native validation evidence
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
          SIGNING_STATE: ${{ needs.package.outputs.signing_state }}
          CANDIDATE_DIGEST: ${{ needs.package.outputs.candidate_digest }}
        run: |
          $releaseMode = if ($env:PUBLIC_RELEASE -eq 'true') {
            'PublicRelease'
          }
          else {
            'PrivateQa'
          }
          .\scripts\new-release-validation-evidence.ps1 `
            -Version $env:RELEASE_VERSION `
            -SigningState $env:SIGNING_STATE `
            -ReleaseMode $releaseMode `
            -CandidateArtifactName "LocalNetworkScanner-$env:RELEASE_VERSION-windows-candidate" `
            -CandidateArtifactDigest $env:CANDIDATE_DIGEST `
            -Repository $env:GITHUB_REPOSITORY `
            -CommitSha $env:GITHUB_SHA `
            -SourceRef $env:GITHUB_REF `
            -WorkflowRunId $env:GITHUB_RUN_ID `
            -WorkflowRunAttempt $env:GITHUB_RUN_ATTEMPT

      - name: Upload compact validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LocalNetworkScanner-${{ needs.preflight.outputs.version }}-windows-validation-evidence
          path: |
            artifacts/validation/VALIDATION-ATTESTATION.json
            artifacts/validation/SIGNING-STATE.txt
          if-no-files-found: error
          retention-days: 30

  validation-gate:
    name: Require successful native Windows validation
    if: ${{ !cancelled() && needs.preflight.outputs.run_candidate == 'true' }}
    needs: [preflight, package, validate-x64, validate-arm64]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require package and native validation jobs
        shell: pwsh
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          X64_RESULT: ${{ needs.validate-x64.result }}
          ARM64_RESULT: ${{ needs.validate-arm64.result }}
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
          SIGNING_STATE: ${{ needs.package.outputs.signing_state }}
        run: |
          $requiredResults = [ordered]@{
            Preflight = $env:PREFLIGHT_RESULT
            Package = $env:PACKAGE_RESULT
            'Native x64 validation' = $env:X64_RESULT
            'Native ARM64 validation' = $env:ARM64_RESULT
          }
          $failedResults = @($requiredResults.GetEnumerator() | Where-Object {
            $_.Value -ne 'success'
          })

          $expectedSigningState = if ($env:PUBLIC_RELEASE -eq 'true') {
            'Signed'
          }
          else {
            'NotSigned'
          }

          @(
            '## Native Windows validation gate',
            '',
            "- Preflight: ``$env:PREFLIGHT_RESULT``",
            "- Package selection: ``$env:PACKAGE_RESULT``",
            "- Native x64 validation: ``$env:X64_RESULT``",
            "- Native ARM64 validation: ``$env:ARM64_RESULT``",
            "- Signing state: ``$env:SIGNING_STATE``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          if ($failedResults.Count -ne 0) {
            $details = $failedResults | ForEach-Object { "$($_.Key)=$($_.Value)" }
            throw "LNS-REL-007: release validation did not complete successfully: $($details -join ', ')."
          }
          if ($env:SIGNING_STATE -ne $expectedSigningState) {
            throw "LNS-REL-005: selected package signing state is '$env:SIGNING_STATE'; expected '$expectedSigningState'."
          }

      - name: Checkout SBOM source metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download immutable candidate and validation evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name "LocalNetworkScanner-$env:RELEASE_VERSION-windows-candidate" `
            --dir .\artifacts\release
          if ($LASTEXITCODE -ne 0) {
            throw 'LNS-REL-008: unable to download the exact immutable candidate.'
          }
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name "LocalNetworkScanner-$env:RELEASE_VERSION-windows-validation-evidence" `
            --dir .\artifacts\validation
          if ($LASTEXITCODE -ne 0) {
            throw 'LNS-REL-007: unable to download the native validation evidence.'
          }

      - name: Materialize and verify exact validated payload contract
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
          SIGNING_STATE: ${{ needs.package.outputs.signing_state }}
          CANDIDATE_DIGEST: ${{ needs.package.outputs.candidate_digest }}
        run: |
          $releaseMode = if ($env:PUBLIC_RELEASE -eq 'true') {
            'PublicRelease'
          }
          else {
            'PrivateQa'
          }
          .\scripts\materialize-release-payload.ps1 `
            -Version $env:RELEASE_VERSION `
            -SigningState $env:SIGNING_STATE `
            -ReleaseMode $releaseMode `
            -CandidateArtifactName "LocalNetworkScanner-$env:RELEASE_VERSION-windows-candidate" `
            -CandidateArtifactDigest $env:CANDIDATE_DIGEST `
            -Repository $env:GITHUB_REPOSITORY `
            -CommitSha $env:GITHUB_SHA `
            -SourceRef $env:GITHUB_REF `
            -WorkflowRunId $env:GITHUB_RUN_ID `
            -WorkflowRunAttempt $env:GITHUB_RUN_ATTEMPT

      - name: Generate and validate SPDX SBOM outside the release payload
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: .\scripts\generate-sbom.ps1 -Version $env:RELEASE_VERSION

      - name: Upload validated SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LocalNetworkScanner-${{ needs.preflight.outputs.version }}-sbom
          path: artifacts/sbom/**
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified GitHub Release
    if: >-
      needs.preflight.outputs.is_tag == 'true' &&
      needs.validation-gate.result == 'success' &&
      (needs.preflight.outputs.public_release == 'true' || needs.preflight.outputs.private_release == 'true')
    needs: [preflight, package, validation-gate]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout release verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download immutable candidate and validation evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name "LocalNetworkScanner-$env:RELEASE_VERSION-windows-candidate" `
            --dir .\artifacts\release
          if ($LASTEXITCODE -ne 0) {
            throw 'LNS-REL-008: unable to download the immutable candidate payload.'
          }
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name "LocalNetworkScanner-$env:RELEASE_VERSION-windows-validation-evidence" `
            --dir .\artifacts\validation
          if ($LASTEXITCODE -ne 0) {
            throw 'LNS-REL-007: unable to download the native validation evidence.'
          }

      - name: Materialize validated 10-asset release payload
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
          SIGNING_STATE: ${{ needs.package.outputs.signing_state }}
          CANDIDATE_DIGEST: ${{ needs.package.outputs.candidate_digest }}
        run: |
          $releaseMode = if ($env:PUBLIC_RELEASE -eq 'true') {
            'PublicRelease'
          }
          else {
            'PrivateQa'
          }
          .\scripts\materialize-release-payload.ps1 `
            -Version $env:RELEASE_VERSION `
            -SigningState $env:SIGNING_STATE `
            -ReleaseMode $releaseMode `
            -CandidateArtifactName "LocalNetworkScanner-$env:RELEASE_VERSION-windows-candidate" `
            -CandidateArtifactDigest $env:CANDIDATE_DIGEST `
            -Repository $env:GITHUB_REPOSITORY `
            -CommitSha $env:GITHUB_SHA `
            -SourceRef $env:GITHUB_REF `
            -WorkflowRunId $env:GITHUB_RUN_ID `
            -WorkflowRunAttempt $env:GITHUB_RUN_ATTEMPT

      - name: Revalidate signed public release contract
        if: needs.preflight.outputs.public_release == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $releaseRoot = (Resolve-Path .\artifacts\release).Path
          $binaryNames = @(
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-x64.zip",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-arm64.zip",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-x64-setup.exe",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-arm64-setup.exe"
          )
          $expectedNames = @(
            $binaryNames
            $binaryNames | ForEach-Object { "$_.sha256" }
            'SHA256SUMS.txt'
            'SIGNING-STATE.txt'
          ) | Sort-Object
          $actualNames = @(Get-ChildItem -LiteralPath $releaseRoot -File |
            Select-Object -ExpandProperty Name |
            Sort-Object)
          $difference = @(Compare-Object -ReferenceObject $expectedNames -DifferenceObject $actualNames)
          if ($difference.Count -ne 0) {
            throw "LNS-REL-008: release payload does not match the exact 10-file contract: $($difference | Out-String)"
          }

          $manifestLines = @(Get-Content -LiteralPath (Join-Path $releaseRoot 'SHA256SUMS.txt'))
          if ($manifestLines.Count -ne $binaryNames.Count) {
            throw "LNS-REL-008: SHA256SUMS.txt must contain exactly $($binaryNames.Count) entries."
          }
          foreach ($binaryName in $binaryNames) {
            $binaryPath = Join-Path $releaseRoot $binaryName
            $expectedLine = '{0} *{1}' -f (
              Get-FileHash -LiteralPath $binaryPath -Algorithm SHA256
            ).Hash.ToLowerInvariant(), $binaryName
            if ((Get-Content -LiteralPath "$binaryPath.sha256" -Raw).Trim() -cne $expectedLine -or
                $manifestLines -cnotcontains $expectedLine) {
              throw "LNS-REL-008: checksum mismatch for $binaryName."
            }
          }

          $state = @(Get-Content -LiteralPath (Join-Path $releaseRoot 'SIGNING-STATE.txt'))
          $expectedState = @(
              "Version: $env:RELEASE_VERSION",
              'Authenticode: Signed',
              'Native x64: Validated',
              'Native ARM64: Validated',
              'Release mode: PublicRelease',
              'Signing backend: Microsoft Artifact Signing OIDC',
              'Verification: Get-AuthenticodeSignature and signtool verify /pa /tw'
          )
          if ($state.Count -ne $expectedState.Count) {
            throw "LNS-REL-005: public SIGNING-STATE.txt must contain exactly $($expectedState.Count) ordered lines."
          }
          for ($index = 0; $index -lt $expectedState.Count; $index++) {
            if ($state[$index] -cne $expectedState[$index]) {
              throw "LNS-REL-005: public SIGNING-STATE.txt line $($index + 1) mismatch."
            }
          }

          function Assert-ValidSignature {
            param([Parameter(Mandatory = $true)][string]$Path)
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($signature.Status -ne 'Valid' -or
                $null -eq $signature.SignerCertificate -or
                $null -eq $signature.TimeStamperCertificate) {
              throw "LNS-REL-005: Authenticode revalidation failed for '$Path': status=$($signature.Status)."
            }
            return $signature.SignerCertificate.Thumbprint
          }

          $signerThumbprints = @()
          foreach ($installerName in $binaryNames | Where-Object { $_.EndsWith('-setup.exe') }) {
            $signerThumbprints += Assert-ValidSignature (Join-Path $releaseRoot $installerName)
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'LocalNetworkScanner-final-revalidation'
          try {
            foreach ($archiveName in $binaryNames | Where-Object { $_.EndsWith('.zip') }) {
              $destination = Join-Path $extractRoot $archiveName
              Expand-Archive -LiteralPath (Join-Path $releaseRoot $archiveName) -DestinationPath $destination
              $archiveBaseName = [IO.Path]::GetFileNameWithoutExtension($archiveName)
              $packageRoot = Join-Path $destination $archiveBaseName
              $expectedSignablePaths = @(
                'LocalNetworkScanner.Cli.exe',
                'LocalNetworkScanner.exe',
                'tools/diagnose-app-control.ps1'
              ) | Sort-Object
              $signableExtensions = @(
                '.appx', '.cat', '.dll', '.exe', '.msi', '.msix', '.ocx',
                '.ps1', '.psd1', '.psm1', '.sys'
              )
              if (-not (Test-Path -LiteralPath $packageRoot -PathType Container)) {
                throw "LNS-REL-008: archive $archiveName is missing its exact package root."
              }
              $actualSignablePaths = @(
                Get-ChildItem -LiteralPath $packageRoot -Recurse -File |
                  Where-Object { $_.Extension.ToLowerInvariant() -in $signableExtensions } |
                  ForEach-Object {
                    [IO.Path]::GetRelativePath($packageRoot, $_.FullName).Replace('\', '/')
                  } |
                  Sort-Object
              )
              $contractDifference = @(
                Compare-Object -ReferenceObject $expectedSignablePaths -DifferenceObject $actualSignablePaths
              )
              if ($contractDifference.Count -ne 0) {
                throw "LNS-REL-008: archive $archiveName differs from the exact signable-path contract: $($contractDifference | Out-String)"
              }
              foreach ($relativePath in $expectedSignablePaths) {
                $signerThumbprints += Assert-ValidSignature (Join-Path $packageRoot $relativePath)
              }
            }
          }
          finally {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (@($signerThumbprints | Sort-Object -Unique).Count -ne 1) {
            throw 'LNS-REL-005: release executables and diagnostic scripts do not share one signer.'
          }
          Write-Host "Release payload revalidated with signer $(@($signerThumbprints | Sort-Object -Unique)[0])."

      - name: Revalidate private QA trust boundary
        if: needs.preflight.outputs.public_release != 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          SIGNING_STATE: ${{ needs.package.outputs.signing_state }}
        run: |
          if ($env:REPOSITORY_PRIVATE -ne 'true') {
            throw 'LNS-REL-005: a NotSigned prerelease may only be published while the repository is private.'
          }
          if ($env:SIGNING_STATE -ne 'NotSigned') {
            throw "LNS-REL-005: private QA publish expected NotSigned; received '$env:SIGNING_STATE'."
          }
          $state = @(Get-Content -LiteralPath '.\artifacts\release\SIGNING-STATE.txt')
          $expectedState = @(
              "Version: $env:RELEASE_VERSION",
              'Authenticode: NotSigned',
              'Native x64: Validated',
              'Native ARM64: Validated',
              'Release mode: PrivateQa',
              'Signing backend: None',
              'Verification: Get-AuthenticodeSignature and signtool verify /pa /tw'
          )
          if ($state.Count -ne $expectedState.Count) {
            throw "LNS-REL-005: private QA SIGNING-STATE.txt must contain exactly $($expectedState.Count) ordered lines."
          }
          for ($index = 0; $index -lt $expectedState.Count; $index++) {
            if ($state[$index] -cne $expectedState[$index]) {
              throw "LNS-REL-005: private QA SIGNING-STATE.txt line $($index + 1) mismatch."
            }
          }

      - name: Publish and verify exact immutable release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PUBLIC_RELEASE: ${{ needs.preflight.outputs.public_release }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          SIGNING_STATE: ${{ needs.package.outputs.signing_state }}
          CANDIDATE_DIGEST: ${{ needs.package.outputs.candidate_digest }}
        run: |
          $isPublicRelease = $env:PUBLIC_RELEASE -eq 'true'
          $repositoryIsPrivate = $env:REPOSITORY_PRIVATE -eq 'true'
          if ($isPublicRelease) {
            if ($env:SIGNING_STATE -ne 'Signed') {
              throw 'LNS-REL-005: public publish received a payload that is not Authenticode Signed.'
            }
          }
          else {
            if (-not $repositoryIsPrivate) {
              throw 'LNS-REL-005: refusing to publish NotSigned assets from a public repository.'
            }
            if ($env:SIGNING_STATE -ne 'NotSigned') {
              throw 'LNS-REL-005: private QA publish received an unexpected signing state.'
            }
          }

          function Assert-LivePrivateRepositoryForUnsignedRelease {
            if ($isPublicRelease) {
              return
            }
            $visibilityResponse = @(
              gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private' 2>&1
            )
            if ($LASTEXITCODE -ne 0 -or
                ($visibilityResponse -join '').Trim().ToLowerInvariant() -ne 'true') {
              throw 'LNS-REL-005: live repository visibility is not private; refusing to publish NotSigned assets.'
            }
          }
          Assert-LivePrivateRepositoryForUnsignedRelease

          $binaryNames = @(
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-x64.zip",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-arm64.zip",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-x64-setup.exe",
            "LocalNetworkScanner-$env:RELEASE_VERSION-win-arm64-setup.exe"
          )
          $assetNames = @(
            $binaryNames
            $binaryNames | ForEach-Object { "$_.sha256" }
            'SHA256SUMS.txt'
            'SIGNING-STATE.txt'
          )
          $assets = @($assetNames | ForEach-Object {
            (Resolve-Path (Join-Path .\artifacts\release $_)).Path
          })
          if ($assets.Count -ne 10) {
            throw "LNS-REL-008: publish must receive exactly 10 local assets; received $($assets.Count)."
          }

          if ($isPublicRelease) {
            $title = "Local Network Scanner $env:RELEASE_VERSION"
            $requiredReleaseNote = "Windows desktop release $env:RELEASE_VERSION."
            $notes = @(
              $requiredReleaseNote,
              '',
              '- `win-x64`: exact ZIP and installer installed, executed and removed on native Windows x64.',
              '- `win-arm64`: exact ZIP and installer installed, executed and removed on a native Windows ARM64 runner.',
              '- UI, CLI, App Control diagnostic, installer and embedded uninstaller use timestamped Microsoft Artifact Signing.',
              '',
              'O instalador não inicia automaticamente a aplicação. Se o Windows apresentar o código 4551, consulte `docs/APP_CONTROL.md`; não desative a política de Controlo de Aplicações.',
              'Consulte também `SIGNING-STATE.txt`, o changelog e as limitações técnicas incluídas no pacote.'
            ) -join [Environment]::NewLine
          }
          else {
            $title = "Local Network Scanner $env:RELEASE_VERSION - Private QA (NotSigned)"
            $requiredReleaseNote = "Private QA prerelease $env:RELEASE_VERSION (NotSigned)."
            $notes = @(
              $requiredReleaseNote,
              '',
              '**Não distribuir como release de produção.** Estes assets não têm uma identidade Authenticode pública e podem ser bloqueados por Smart App Control, WDAC ou AppLocker com o código 4551.',
              '',
              '- O ZIP e instalador x64 exatos foram instalados, executados e removidos em Windows x64 nativo.',
              '- O ZIP e instalador ARM64 exatos foram instalados, executados e removidos num runner Windows ARM64 nativo.',
              '- `SIGNING-STATE.txt` regista `PrivateQa`, `NotSigned` e as duas validações nativas.',
              '- Esta prerelease só foi criada porque o repositório estava privado durante o workflow.',
              '',
              'Para distribuição pública é obrigatória uma nova execução com Microsoft Artifact Signing Public Trust, autorização IEEE e `publish_release=true`.'
            ) -join [Environment]::NewLine
          }

          $ownershipMarker = '<!-- lns-release-owner schema=1 run={0} commit={1} candidate={2} -->' -f @(
            $env:GITHUB_RUN_ID,
            $env:GITHUB_SHA.ToLowerInvariant(),
            $env:CANDIDATE_DIGEST.ToLowerInvariant()
          )
          $notes = $notes + [Environment]::NewLine + [Environment]::NewLine + $ownershipMarker
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_API_URL)) {
            throw 'LNS-REL-008: GITHUB_API_URL is unavailable.'
          }
          $apiRoot = "$($env:GITHUB_API_URL.TrimEnd('/'))/repos/$env:GITHUB_REPOSITORY"
          $apiHeaders = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          function Invoke-GitHubApi {
            param(
              [Parameter(Mandatory = $true)][ValidateSet('Get', 'Post', 'Patch', 'Delete')][string]$Method,
              [Parameter(Mandatory = $true)][string]$Path,
              [hashtable]$Body,
              [switch]$AllowNotFound
            )

            $request = @{
              Method = $Method
              Uri = "$apiRoot/$Path"
              Headers = $apiHeaders
            }
            if ($null -ne $Body) {
              $request.ContentType = 'application/json'
              $request.Body = $Body | ConvertTo-Json -Depth 8 -Compress
            }
            try {
              $response = Invoke-RestMethod @request
              return $response
            }
            catch {
              $statusCode = 0
              if ($null -ne $_.Exception.Response) {
                $statusCode = [int]$_.Exception.Response.StatusCode
              }
              if ($AllowNotFound -and $statusCode -eq 404) {
                return $null
              }
              throw "LNS-REL-008: GitHub API $Method '$Path' failed with HTTP ${statusCode}: $($_.Exception.Message)"
            }
          }

          function Get-LiveTagTargetCommit {
            $escapedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
            $reference = Invoke-GitHubApi -Method Get -Path "git/ref/tags/$escapedTag"
            if ([string]$reference.ref -cne "refs/tags/$env:RELEASE_TAG") {
              throw "LNS-REL-009: GitHub returned an unexpected ref for $env:RELEASE_TAG."
            }

            $object = $reference.object
            $referenceType = ([string]$object.type).ToLowerInvariant()
            $referenceSha = ([string]$object.sha).ToLowerInvariant()
            $visited = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            $resolvedCommit = $null
            for ($depth = 0; $depth -lt 8; $depth++) {
              $type = ([string]$object.type).ToLowerInvariant()
              $sha = ([string]$object.sha).ToLowerInvariant()
              if ($sha -notmatch '^[0-9a-f]{40}$') {
                throw "LNS-REL-009: tag $env:RELEASE_TAG resolved to an invalid Git object SHA."
              }
              if ($type -eq 'commit') {
                $resolvedCommit = $sha
                break
              }
              if ($type -ne 'tag' -or -not $visited.Add($sha)) {
                throw "LNS-REL-009: tag $env:RELEASE_TAG does not resolve safely to one commit."
              }
              $tagObject = Invoke-GitHubApi -Method Get -Path "git/tags/$sha"
              if ([string]$tagObject.sha -cne $sha) {
                throw "LNS-REL-009: annotated tag object SHA changed while resolving $env:RELEASE_TAG."
              }
              $object = $tagObject.object
            }
            if ([string]::IsNullOrWhiteSpace($resolvedCommit)) {
              throw "LNS-REL-009: annotated tag $env:RELEASE_TAG exceeds the safe dereference depth."
            }

            $confirmedReference = Invoke-GitHubApi -Method Get -Path "git/ref/tags/$escapedTag"
            if ([string]$confirmedReference.ref -cne "refs/tags/$env:RELEASE_TAG" -or
                ([string]$confirmedReference.object.type).ToLowerInvariant() -cne $referenceType -or
                ([string]$confirmedReference.object.sha).ToLowerInvariant() -cne $referenceSha) {
              throw "LNS-REL-009: tag $env:RELEASE_TAG changed while its target was being resolved."
            }
            return $resolvedCommit
          }

          function Assert-LiveTagTargetsWorkflowCommit {
            $tagCommit = Get-LiveTagTargetCommit
            if ($tagCommit -cne $env:GITHUB_SHA.ToLowerInvariant()) {
              throw "LNS-REL-009: live tag $env:RELEASE_TAG targets $tagCommit instead of workflow commit $env:GITHUB_SHA."
            }
          }

          function Get-RemoteReleaseByTag {
            param([switch]$AllowNotFound)
            $escapedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
            Invoke-GitHubApi `
              -Method Get `
              -Path "releases/tags/$escapedTag" `
              -AllowNotFound:$AllowNotFound
          }

          function Test-OwnedDraft {
            param([Parameter(Mandatory = $true)][object]$Release)
            $body = [string]$Release.body
            return [bool]$Release.draft -and
              [string]$Release.tag_name -ceq $env:RELEASE_TAG -and
              [string]$Release.name -ceq $title -and
              [bool]$Release.prerelease -eq (-not $isPublicRelease) -and
              $body.IndexOf($ownershipMarker, [StringComparison]::Ordinal) -ge 0
          }

          function Remove-OwnedDraftIfSafe {
            param([Parameter(Mandatory = $true)][long]$ReleaseId)
            $current = Invoke-GitHubApi `
              -Method Get `
              -Path "releases/$ReleaseId" `
              -AllowNotFound
            if ($null -eq $current) {
              return
            }
            if (-not (Test-OwnedDraft -Release $current)) {
              throw "LNS-REL-008: refusing to delete release $ReleaseId because it is not the owned draft for this run."
            }
            Invoke-GitHubApi -Method Delete -Path "releases/$ReleaseId" | Out-Null
            $remaining = Invoke-GitHubApi `
              -Method Get `
              -Path "releases/$ReleaseId" `
              -AllowNotFound
            if ($null -ne $remaining) {
              throw "LNS-REL-008: owned draft $ReleaseId still exists after cleanup."
            }
          }

          function Assert-RemoteRelease {
            param(
              [Parameter(Mandatory = $true)][object]$Release,
              [Parameter(Mandatory = $true)][bool]$ExpectedDraft,
              [Parameter(Mandatory = $true)][bool]$ExpectedPrerelease
            )

            $releaseBody = [string]$Release.body
            if ([string]$Release.tag_name -cne $env:RELEASE_TAG -or
                [string]$Release.name -cne $title -or
                [bool]$Release.draft -ne $ExpectedDraft -or
                [bool]$Release.prerelease -ne $ExpectedPrerelease -or
                $releaseBody.IndexOf($requiredReleaseNote, [StringComparison]::Ordinal) -lt 0) {
              throw "LNS-REL-008: remote release state mismatch for $env:RELEASE_TAG."
            }
            $remoteAssets = @($Release.assets)
            $remoteNames = @($remoteAssets | ForEach-Object { [string]$_.name } | Sort-Object)
            $expectedNames = @($assetNames | Sort-Object)
            $difference = @(
              Compare-Object -ReferenceObject $expectedNames -DifferenceObject $remoteNames
            )
            if ($remoteAssets.Count -ne 10 -or $difference.Count -ne 0) {
              throw "LNS-REL-008: remote release does not contain the exact 10-asset contract: $($difference | Out-String)"
            }
            foreach ($name in $assetNames) {
              $matches = @($remoteAssets | Where-Object { [string]$_.name -ceq $name })
              if ($matches.Count -ne 1 -or [string]$matches[0].state -cne 'uploaded') {
                throw "LNS-REL-008: remote release must contain exactly one uploaded asset named $name."
              }
              $localFile = Get-Item -LiteralPath (Join-Path '.\artifacts\release' $name)
              $localDigest = 'sha256:{0}' -f (
                Get-FileHash -LiteralPath $localFile.FullName -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              if ([string]$matches[0].digest -cne $localDigest -or
                  [long]$matches[0].size -ne $localFile.Length) {
                throw "LNS-REL-008: remote release asset digest or size mismatch for $name."
              }
            }
          }

          function Get-VerifiedRemoteRelease {
            param(
              [Parameter(Mandatory = $true)][bool]$ExpectedDraft,
              [Parameter(Mandatory = $true)][bool]$ExpectedPrerelease
            )

            $lastFailure = ''
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              $release = Get-RemoteReleaseByTag
              try {
                Assert-RemoteRelease `
                  -Release $release `
                  -ExpectedDraft $ExpectedDraft `
                  -ExpectedPrerelease $ExpectedPrerelease
                return $release
              }
              catch {
                $lastFailure = $_.Exception.Message
                if ($attempt -lt 5) {
                  Start-Sleep -Seconds 2
                }
              }
            }
            throw "LNS-REL-008: remote release verification did not converge: $lastFailure"
          }

          Assert-LivePrivateRepositoryForUnsignedRelease
          Assert-LiveTagTargetsWorkflowCommit

          $ownedDraftId = $null
          $publicationConfirmed = $false
          try {
            $existingRelease = Get-RemoteReleaseByTag -AllowNotFound
            if ($null -ne $existingRelease -and -not [bool]$existingRelease.draft) {
              $publishedRelease = Get-VerifiedRemoteRelease `
                -ExpectedDraft $false `
                -ExpectedPrerelease (-not $isPublicRelease)
              Write-Host "Release $env:RELEASE_TAG is already published with the exact verified assets."
            }
            else {
              if ($null -ne $existingRelease) {
                if (-not (Test-OwnedDraft -Release $existingRelease)) {
                  throw "LNS-REL-008: an unowned or mismatched draft already exists for $env:RELEASE_TAG."
                }
                $ownedDraftId = [long]$existingRelease.id
                Assert-LiveTagTargetsWorkflowCommit
                Remove-OwnedDraftIfSafe -ReleaseId $ownedDraftId
                $ownedDraftId = $null
              }

              Assert-LiveTagTargetsWorkflowCommit
              $createdDraft = Invoke-GitHubApi -Method Post -Path 'releases' -Body @{
                tag_name = $env:RELEASE_TAG
                name = $title
                body = $notes
                draft = $true
                prerelease = -not $isPublicRelease
              }
              if ([long]$createdDraft.id -le 0) {
                throw "LNS-REL-008: GitHub did not return a valid draft release ID."
              }
              $ownedDraftId = [long]$createdDraft.id
              if (-not (Test-OwnedDraft -Release $createdDraft)) {
                throw "LNS-REL-008: created draft does not carry the expected ownership marker and metadata."
              }

              Assert-LiveTagTargetsWorkflowCommit
              $uploadArguments = @(
                'release', 'upload', $env:RELEASE_TAG
              ) + $assets + @(
                '--repo', $env:GITHUB_REPOSITORY
              )
              & gh @uploadArguments
              if ($LASTEXITCODE -ne 0) {
                throw "LNS-REL-008: unable to upload the exact assets to draft release $env:RELEASE_TAG."
              }

              $draftRelease = Get-VerifiedRemoteRelease `
                -ExpectedDraft $true `
                -ExpectedPrerelease (-not $isPublicRelease)
              if ([long]$draftRelease.id -ne $ownedDraftId) {
                throw "LNS-REL-008: verified draft ID does not match the draft created by this run."
              }

              Assert-LiveTagTargetsWorkflowCommit
              Assert-LivePrivateRepositoryForUnsignedRelease
              $publishedRelease = Invoke-GitHubApi `
                -Method Patch `
                -Path "releases/$ownedDraftId" `
                -Body @{
                  draft = $false
                  prerelease = -not $isPublicRelease
                }
              if ([bool]$publishedRelease.draft) {
                throw "LNS-REL-008: release $env:RELEASE_TAG remains a draft after publication."
              }
              $publishedRelease = Get-VerifiedRemoteRelease `
                -ExpectedDraft $false `
                -ExpectedPrerelease (-not $isPublicRelease)
            }

            Assert-LiveTagTargetsWorkflowCommit
            Assert-LivePrivateRepositoryForUnsignedRelease
            $publicationConfirmed = $true
          }
          catch {
            $originalFailure = $_
            if ($null -ne $ownedDraftId -and -not $publicationConfirmed) {
              try {
                Remove-OwnedDraftIfSafe -ReleaseId $ownedDraftId
                Write-Host "Removed owned draft $ownedDraftId after a pre-publication failure."
              }
              catch {
                Write-Host "::warning title=LNS-REL-008::Owned draft cleanup was not safe or did not complete: $($_.Exception.Message)"
              }
            }
            throw $originalFailure
          }

          $runArtifacts = Invoke-GitHubApi `
            -Method Get `
            -Path "actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100"
          $candidateName = "LocalNetworkScanner-$env:RELEASE_VERSION-windows-candidate"
          $candidateArtifacts = @($runArtifacts.artifacts | Where-Object {
            [string]$_.name -ceq $candidateName -and -not [bool]$_.expired
          })
          if ($candidateArtifacts.Count -gt 1) {
            throw "LNS-REL-008: release is verified, but multiple current-run candidate artifacts were found."
          }
          if ($candidateArtifacts.Count -eq 1) {
            $expectedArtifactDigest = $env:CANDIDATE_DIGEST.ToLowerInvariant().Replace('sha256:', '')
            $actualArtifactDigest = ([string]$candidateArtifacts[0].digest).ToLowerInvariant().Replace('sha256:', '')
            if ([string]::IsNullOrWhiteSpace($actualArtifactDigest) -or
                $actualArtifactDigest -cne $expectedArtifactDigest) {
              throw 'LNS-REL-008: release is verified, but the candidate selected for cleanup has an unexpected digest.'
            }
            Invoke-GitHubApi `
              -Method Delete `
              -Path "actions/artifacts/$($candidateArtifacts[0].id)" | Out-Null
            $artifactCleanup = 'deleted after final verification'
          }
          else {
            $artifactCleanup = 'already absent (idempotent cleanup)'
          }

          @(
            '## Verified GitHub Release',
            '',
            "- Tag: ``$env:RELEASE_TAG``",
            "- Mode: ``$(if ($isPublicRelease) { 'Public Signed' } else { 'Private QA prerelease (NotSigned)' })``",
            '- Remote assets: `10` (names, sizes and SHA-256 verified)',
            "- Heavy candidate artifact: $artifactCleanup",
            '- Compact validation evidence and SBOM: retained for 30 days'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

